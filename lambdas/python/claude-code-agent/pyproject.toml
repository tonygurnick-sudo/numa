[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.poetry]
name = "claude-code-agent"
version = "0.1.0"
description = "Generic Claude Code runner for Numa data analysis"
authors = ["Arcanum AI"]
readme = "README.md"
packages = [
    { include = "**/*.py" },
]
include = [
    { path = "nolia_report/templates/*.md", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "~3.13.0"

aws-lambda-powertools = "3.9.0"
helpers = {path = "../../../lib/helpers", develop = true}
s3_helpers = {path = "../../../lib/s3_helpers", develop = true}
bedrock = {path = "../../../lib/bedrock", develop = true}
structlog = "25.2.0"
openpyxl = ">=3.1.5"
et-xmlfile = ">=1.1.0"
PyPDF2 = ">=3.0.0"
python-docx = ">=1.1.2"
python-pptx = ">=1.0.2"
xlrd = ">=2.0.1"
extract-msg = ">=0.48.7"
beautifulsoup4 = ">=4.12.3"
html5lib = ">=1.1"
XlsxWriter = ">=3.2.0"
plotly = ">=5.24.1"
prm = {path = "../../../lib/prm", develop = true}

# Common data-analysis stack expected by the agent's prompt

[tool.poetry.group.dev.dependencies]
mypy = "1.17.1"
pylint = "3.3.8"
pyright = "1.1.403"
boto3-stubs = "^1.35.54"
