[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.poetry]
name = "racetech-upload-url"
version = "0.1.0"
description = "Presigned S3 PUT URL for Racetech external data feed"
authors = ["Arcanum"]
packages = [
    { include = "**/*.py" },
]

[tool.poetry.dependencies]
python = "^3.13"
boto3 = "^1.34.0"
structlog = "^24.1.0"
prm = { path = "../../../lib/prm", develop = true }

[tool.poetry.group.dev.dependencies]
mypy = "1.17.1"
pylint = "3.3.8"
pyright = "1.1.403"
boto3-stubs = "^1.35.54"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
pretty = true
