[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.poetry]
name = "step-function-start"
version = "0.1.0"
description = ""
authors = ["ArcanumAI"]
readme = "README.md"
packages = [
    { include = "**/*.py" },
]

[tool.poetry.dependencies]
python = "~3.13.0"

aws-lambda-powertools = "3.8.0"
boto3 = "1.37.15"
helpers = {path = "../../../lib/helpers", develop = true}
structlog = "25.2.0"

[tool.poetry.group.dev.dependencies]
boto3-stubs = "1.37.15"
mypy = "1.15.0"
pylint = "3.3.5"
pyright = "1.1.396"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.9.0"
poetry-plugin-lambda-build = ">=1.0.7"

[tool.poetry-plugin-lambda-build]
package-artifact-path = "lambda_function.zip"
without = "dev"
