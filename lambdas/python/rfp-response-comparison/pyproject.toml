[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "rfp_response_comparison"
version = "0.1.0"
description = "RFP response comparison lambda"
authors = ["Arcanum AI"]
readme = "README.md"
packages = [{ include = "**/*.py" }]

[tool.poetry.dependencies]
python = "~3.13.0"

aws-lambda-powertools = "3.9.0"
bedrock = { path = "../../../lib/bedrock", develop = true }
helpers = { path = "../../../lib/helpers", develop = true }
s3_helpers = { path = "../../../lib/s3_helpers", develop = true }

[tool.poetry.group.dev.dependencies]
mypy = "1.16.1"
pylint = "3.3.7"
pyright = "1.1.402"
