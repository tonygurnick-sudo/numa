[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.poetry]
name = "beyond-expectations-report-and-email"
version = "0.1.0"
description = ""
authors = ["Nathan Douglas <nathan@arcanum.ai>"]
readme = "README.md"
packages = [
    { include = "**/*.py" },
    { include = "templates" }
]

[tool.poetry.dependencies]
python = "~3.13.0"

aws-lambda-powertools = "3.9.0"
helpers = {path = "../../../lib/helpers", develop = true}
s3_helpers = {path = "../../../lib/s3_helpers", develop = true}
bedrock = {path = "../../../lib/bedrock", develop = true}
structlog = "^25.0.0"
jinja2 = "^3.1.6"
pytz = "^2024.1"

[tool.poetry.group.dev.dependencies]
mypy = "1.17.1"
pylint = "3.3.8"
pyright = "1.1.403"
boto3-stubs = "^1.38.23"
types-pytz = "^2024.1"
[tool.poetry.group.boto.dependencies]
boto3 = "1.37.20"
