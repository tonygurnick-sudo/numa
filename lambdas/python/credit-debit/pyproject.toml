[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = ["**/tests/**/*"]
source = ["."]

[tool.poetry]
name = "credit-debit"
version = "0.1.0"
description = "Live credit metering — debit Lambda for the Numa Credit System (SPK-015)"
authors = ["Arcanum"]
packages = [
    { include = "**/*.py" },
]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
boto3 = "^1.34.0"
structlog = "^24.1.0"
tzdata = "^2025.1"  # IANA tz DB for zoneinfo("Pacific/Auckland") — NZ billing calendar
prm = {path = "../../../lib/prm", develop = true}
credit-pricing = {path = "../../../lib/credit-pricing", develop = true}

[tool.poetry.group.dev.dependencies]
mypy = "1.17.1"
pylint = "3.3.8"
pyright = "1.1.403"
boto3-stubs = "^1.35.54"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
