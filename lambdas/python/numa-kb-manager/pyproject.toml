[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.poetry]
name = "numa-kb-manager"
version = "0.1.0"
description = "Knowledge Base management API (CRUD + sync state) — split out of numa-chat-agent for cost/cold-start isolation"
authors = ["ArcanumAI"]
readme = "README.md"
packages = [
    { include = "numa_kb_manager" },
]

[tool.poetry.dependencies]
python = "~3.13.0"
prm = {path = "../../../lib/prm", develop = true}
kb-core = {path = "../../../lib/kb-core", develop = true}
boto3 = "^1.37.0"
structlog = "^25.2.0"
requests = "^2.31.0"
pyjwt = {extras = ["crypto"], version = "^2.8.0"}
fastapi = "^0.115.0"
mangum = "^0.19.0"

[tool.poetry.group.dev.dependencies]
pyright = "1.1.402"
boto3-stubs = { version = "^1.37.0", extras = ["dynamodb", "s3", "cognito-idp", "bedrock-agent", "qbusiness"] }
types-requests = "^2.32.0.20241016"
pytest = "^8.4.2"

[tool.pyright]
typeCheckingMode = "basic"
reportMissingImports = "none"
exclude = ["tests", "build_venv", ".venv", "lambda_function.build", "wheels"]
