[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "numa-standard-model-relay"
version = "0.1.0"
description = "Deployer-account streaming relay for the opaque Numa Standard Model (OpenRouter egress chokepoint)"
authors = ["ArcanumAI"]
packages = [{ include = "*.py" }]

[tool.poetry.dependencies]
python = "~3.13.0"
boto3 = "^1.40"
fastapi = "^0.115"
uvicorn = "^0.30"
httpx = "^0.27"
structlog = "^25.2.0"
prm = { path = "../../../lib/prm", develop = true }

[tool.poetry.group.dev.dependencies]
mypy = "^1.13"
pylint = "^3.3"
pyright = "^1.1"
pytest = "^8.3"
boto3-stubs = "^1.40.0"

[tool.pyright]
typeCheckingMode = "basic"
reportMissingImports = "none"
exclude = ["tests"]

[tool.coverage.run]
omit = ["**/tests/**/*"]
source = ["."]
