[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.poetry]
name = "cognito-custom-email-sender"
version = "0.1.0"
description = "Cognito CustomEmailSender trigger — sends auth emails via the central numa-email-sender (BUG-188)"
authors = ["ArcanumAI"]
packages = [
    { include = "**/*.py" },
]

[tool.poetry.dependencies]
python = "^3.13"
boto3 = "^1.37.0"
structlog = "^25.2.0"
aws-encryption-sdk = "^4.0.0"
prm = {path = "../../../lib/prm", develop = true}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
mypy = "1.16.1"
pylint = "3.3.7"
pyright = "1.1.402"
boto3-stubs = "^1.37.0"
