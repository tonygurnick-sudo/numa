[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.poetry]
name = "ws-authorizer"
version = "1.0.0"
description = "WebSocket Lambda Authorizer for Cognito JWT validation"
authors = ["Numa"]
readme = "README.md"
packages = [
    { include = "**/*.py" },
]

[tool.poetry.dependencies]
python = "^3.13"
pyjwt = {extras = ["crypto"], version = "^2.8.0"}
requests = "^2.31.0"
structlog = "^23.2.0"
boto3 = "^1.34.0"

[tool.poetry.group.dev.dependencies]
types-requests = "^2.31.0"
mypy = "1.15.0"
pylint = "3.3.7"
pyright = "1.1.401"
