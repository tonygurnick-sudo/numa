[tool.poetry]
name = "backfill-metadata"
version = "0.1.0"
description = "Backfill metadata for existing files in default KB"
authors = ["Arcanum"]
packages = [{include = "lambda_function.py"}]

[tool.poetry.dependencies]
python = "^3.12"
boto3 = "^1.34.0"
structlog = "^24.1.0"

[tool.poetry.dev-dependencies]
pylint = "^3.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
