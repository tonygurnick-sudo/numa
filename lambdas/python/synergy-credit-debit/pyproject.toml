[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = ["**/tests/**/*"]
source = ["."]

[tool.poetry]
name = "numa-synergy-credit-debit"
version = "0.1.0"
description = "Numa Synergy: meter a completed KB crawl run's ingestion consumption into the Numa Credit ledger"
authors = ["Arcanum"]
packages = [{ include = "**/*.py" }]

[tool.poetry.dependencies]
python = "~3.13.0"
structlog = "25.2.0"
tzdata = "^2025.1"
credit-pricing = { path = "../../../lib/credit-pricing", develop = true }
prm = { path = "../../../lib/prm", develop = true }

[tool.poetry.group.dev.dependencies]
mypy = "1.17.1"
pylint = "3.3.8"
pyright = "1.1.403"
pytest = "^8.3"

[tool.poetry.group.boto.dependencies]
boto3 = "1.40.25"

[tool.pytest.ini_options]
pythonpath = ["."]
