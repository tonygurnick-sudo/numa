[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.poetry]
name = "synergy-text-crawler"
version = "0.1.0"
description = "Per-job worker that extracts Synergy document text into a Bedrock-KB corpus"
authors = ["Arcanum AI <dev@arcanum.ai>"]
packages = [
    { include = "**/*.py" },
]

[tool.poetry.dependencies]
python = "~3.13.0"
prm = {path = "../../../lib/prm", develop = true}
httpx = "^0.28.0"
structlog = "^23.1.0"
pdfplumber = "^0.11.4"
pypdf = "^5.1.0"
python-docx = "^1.1.2"
openpyxl = "^3.1.5"
python-pptx = "^1.0.2"
beautifulsoup4 = "^4.12.0"
extract-msg = ">=0.48.7"

[tool.poetry.group.dev.dependencies]
boto3-stubs = "^1.37.20"
mypy = "^1.15.0"
pylint = "^3.3.6"
pyright = "^1.1.400"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"

[tool.poetry.group.boto.dependencies]
boto3 = "1.40.25"
