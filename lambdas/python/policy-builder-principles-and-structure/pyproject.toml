[tool.poetry]
name = "policy-builder-principals-and-structure"
version = "0.1.0"
description = "Part of the policy builder Step Function"
authors = ["Arcanum AI"]
readme = "README.md"
packages = [
    { include = "**/*.py" },
]

[tool.poetry.dependencies]
python = "~3.13.0"

aws-lambda-powertools = "3.3.0"
bedrock = {path = "../../../lib/bedrock", develop = true}
boto3 = "1.35.79"
helpers = {path = "../../../lib/helpers", develop = true}
structlog = "24.4.0"

[tool.poetry.group.dev.dependencies]
boto3-stubs = "1.35.79"
mypy = "1.13.0"
pylint = "3.3.2"
pyright = "1.1.391"

[tool.poetry-plugin-lambda-build]
package-artifact-path = "lambda_function.zip"
without = "dev"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
