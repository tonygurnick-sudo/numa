[tool.poetry]
name = "company-profile"
version = "0.1.0"
description = ""
authors = ["Sam Bentley <sam@arcanum.ai>"]
readme = "README.md"
packages = [
    { include = "**/*.py" },
]

[tool.poetry.dependencies]
python = "~3.13.0"

bedrock = {path = "../../../lib/bedrock", develop = true}
helpers = {path = "../../../lib/helpers", develop = true}
s3_helpers = {path = "../../../lib/s3_helpers", develop = true}

boto3 = "1.36.13"
structlog = "25.1.0"

[tool.poetry.group.dev.dependencies]
mypy = "1.15.0"
pylint = "3.3.4"
pyright = "1.1.393"
pre-commit = "^4.1.0"
poetry-plugin-lambda-build = "^1.0.7"
pytest = "^8.3.4"
boto3-stubs = "^1.36.3"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.9.0"
poetry-plugin-lambda-build = ">=1.0.7"

[tool.poetry-plugin-lambda-build]
package-artifact-path = "lambda_function.zip"
without = "dev"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
