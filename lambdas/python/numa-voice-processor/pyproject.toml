[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.poetry]
name = "numa-voice-processor"
version = "0.1.0"
description = "Numa Voice: S3 call-recording -> Amazon Transcribe (diarised) -> normalised transcript JSON"
authors = ["Arcanum"]
packages = [
    { include = "**/*.py" },
]

[tool.poetry.dependencies]
python = "~3.13.0"
aws-transcribe = {path = "../../../lib/aws-transcribe", develop = true}
prm = {path = "../../../lib/prm", develop = true}
structlog = "25.2.0"

[tool.poetry.group.dev.dependencies]
mypy = "1.17.1"
pylint = "3.3.8"
pyright = "1.1.403"
boto3-stubs = "1.40.25"

[tool.poetry.group.boto.dependencies]
boto3 = "1.40.25"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
pretty = true
