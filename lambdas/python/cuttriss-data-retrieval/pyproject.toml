[tool.poetry]
name = "cuttriss-data-retrieval"
version = "0.1.0"
description = "12d Synergy -> S3 downloader (Cuttriss) for Numa"
authors = ["Numa"]
readme = "README.md"
packages = [
  { include = "lambda_function.py" }
]

[tool.poetry.dependencies]
python = "^3.11"
boto3 = "1.34.131"
botocore = "1.34.131"
requests = "2.32.3"
structlog = "24.1.0"
aws-lambda-powertools = { version = "2.36.0", extras = ["logger"] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
moto = "^5.0.12"
types-requests = "^2.32.0.20241016"

[tool.poetry.plugins."console_scripts"]
# (none)

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

# Optional: keep zip small by excluding dev deps when exporting
[tool.cuttriss.build]
artifact_name = "lambda_function.zip"
