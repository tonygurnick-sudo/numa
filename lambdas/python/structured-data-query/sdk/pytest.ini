[pytest]
# Pytest configuration for DB CLI SDK tests

# Test markers
markers =
    unit: Unit tests with mocked dependencies (fast, no external deps)
    integration: Integration tests that execute real CLI commands (slower)
    slow: Tests that take more than 1 second
    requires_api_key: Tests that require ANTHROPIC_API_KEY
    requires_db: Tests that require PostgreSQL database
    requires_aws: Tests that require AWS credentials

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --strict-markers
    --tb=short
    -ra

# Coverage options (when using --cov)
[coverage:run]
source = .
omit =
    tests/*
    */site-packages/*
    conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
