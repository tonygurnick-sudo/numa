[tool.poetry]
name = "seed-default-kb"
version = "0.1.0"
description = "Seed default company knowledge base on stack deployment"
authors = ["Arcanum"]
packages = [{include = "lambda_function.py"}]

[tool.poetry.dependencies]
python = "^3.12"
boto3 = "^1.34.0"
