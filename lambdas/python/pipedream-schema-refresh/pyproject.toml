[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "pipedream-schema-refresh"
version = "0.1.0"
description = "Pipedream Schema Refresh Lambda - Pre-fetches integration schemas into DynamoDB cache"
authors = ["ArcanumAI"]
packages = [
    { include = "**/*.py" },
]

[tool.poetry.dependencies]
python = "~3.13.0"
aws-lambda-powertools = "3.9.0"
boto3 = "^1.37.0"
structlog = "^25.2.0"
requests = "^2.32.0"
prm = {path = "../../../lib/prm", develop = true}
