[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[tool.poetry]
name = "ws-disconnect"
version = "0.1.0"
description = "WebSocket disconnect handler"
authors = ["Numa"]
readme = "README.md"
packages = [
    { include = "**/*.py" },
]

[tool.poetry.dependencies]
python = "^3.13"
boto3 = "^1.34.0"
structlog = "^24.0.0"

[tool.poetry.group.dev.dependencies]
mypy = "1.17.1"
pylint = "3.3.8"
pyright = "1.1.403"
