[tool.poetry]
name = "policy-builder-legal-review"
version = "0.1.0"
description = "Part of the policy builder Step Function"
authors = ["Arcanum AI"]
readme = "README.md"
packages = [
    { include = "**/*.py" },
]

[tool.poetry.dependencies]
python = "~3.13.0"

aws-lambda-powertools = "3.5.0"
bedrock = {path = "../../../lib/bedrock", develop = true}
boto3 = "1.36.12"
helpers = {path = "../../../lib/helpers", develop = true}
structlog = "25.1.0"

[tool.poetry.group.dev.dependencies]
boto3-stubs = "1.36.12"
mypy = "1.14.1"
pylint = "3.3.4"
pyright = "1.1.393"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.9.0"
poetry-plugin-lambda-build = ">=1.0.7"

[tool.poetry-plugin-lambda-build]
package-artifact-path = "lambda_function.zip"
without = "dev"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
