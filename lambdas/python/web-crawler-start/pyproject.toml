[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.poetry]
name = "web-crawler-start"
version = "0.1.0"
description = "Lambda function to start the web crawler step function"
authors = ["Sam Bentley <sam@arcanum.ai>"]
packages = [
    { include = "**/*.py" },
]

[tool.poetry.dependencies]
python = "~3.13.0"
structlog = "^25.2.0"
aws-lambda-powertools = "^3.9.0"

[tool.poetry.group.dev.dependencies]
boto3-stubs = "^1.37.20"
mypy = "^1.15.0"
pylint = "^3.3.7"
pyright = "^1.1.401"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
[tool.poetry.group.boto.dependencies]
boto3 = "1.40.25"
