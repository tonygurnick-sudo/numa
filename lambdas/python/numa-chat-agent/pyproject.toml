[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.poetry]
name = "numa-chat-agent"
version = "0.1.0"
description = "A Python agent for Numa Chat"
authors = ["ArcanumAI"]
readme = "README.md"
packages = [
    { include = "**/*.py" },
]

[tool.poetry.dependencies]
python = "~3.13.0"
aws-lambda-powertools = "3.9.0"
strands-agents = "1.0.0"
strands-agents-tools = "0.2.1"
boto3 = "^1.37.0"
structlog = "^25.2.0"
opentelemetry-api = "^1.34.0"
opentelemetry-sdk = "^1.34.0"
requests = "^2.31.0"
httpx = "^0.28.1"
beautifulsoup4 = "^4.12.2"
ddgs = "^9.6.0"
s3_helpers = {path = "../../../lib/s3_helpers", develop = true}

[tool.poetry.group.dev.dependencies]
mypy = "1.16.1"
pylint = "3.3.7"
pyright = "1.1.402"
boto3-stubs = "^1.38.45"
