[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.poetry]
name = "numa-chat-agent"
version = "0.1.0"
description = "A Python agent for Numa Chat"
authors = ["ArcanumAI"]
readme = "README.md"
packages = [
    { include = "**/*.py" },
]

[tool.poetry.dependencies]
python = "~3.13.0"
aws-lambda-powertools = "3.9.0"
strands-agents = "0.1.7"
strands-agents-tools = "0.1.0"
structlog = "^25.2.0"
opentelemetry-api = "^1.34.0"
opentelemetry-sdk = "^1.34.0"
requests = "^2.31.0"
httpx = "^0.28.1"
googlesearch-python = "^1.1.0"
beautifulsoup4 = "^4.12.2"
s3_helpers = {path = "../../../lib/s3_helpers", develop = true}

[tool.poetry.group.dev.dependencies]
mypy = "1.17.1"
pylint = "3.3.8"
pyright = "1.1.403"
boto3-stubs = "^1.38.45"
[tool.poetry.group.boto.dependencies]
boto3 = "1.37.20"
