[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.poetry]
name = "numa-chat-agent"
version = "0.1.0"
description = "A Python agent for Numa Chat"
authors = ["ArcanumAI"]
readme = "README.md"
# Package only the module tree explicitly and include non-Python assets needed at runtime
packages = [
    { include = "numa_chat_agent" },
]
# Ensure prompt markdown files are included in the built wheel/sdist so Lambda can read them
include = [
    { path = "numa_chat_agent/mcp/providers/pipedream/prompts/*.md", format = "wheel" },
    { path = "numa_chat_agent/mcp/providers/pipedream/prompts/*.md", format = "sdist" },
]

[tool.poetry.dependencies]
python = "~3.13.0"
bedrock = {path = "../../../lib/bedrock", develop = true}
aws-lambda-powertools = "3.9.0"
strands-agents = "1.0.0"
strands-agents-tools = "0.2.1"
boto3 = "^1.37.0"
structlog = "^25.2.0"
opentelemetry-api = "^1.34.0"
opentelemetry-sdk = "^1.34.0"
requests = "^2.31.0"
pyjwt = {extras = ["crypto"], version = "^2.8.0"}
httpx = "^0.28.1"
beautifulsoup4 = "^4.12.2"
ddgs = "^9.6.0"
jsonschema = "^4.24.0"
s3_helpers = {path = "../../../lib/s3_helpers", develop = true}
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
h11 = "^0.14.0"

[tool.poetry.group.dev.dependencies]
mypy = "1.16.1"
pylint = "3.3.7"
pyright = "1.1.402"
boto3-stubs = { version = "^1.37.0", extras = ["dynamodb"] }
types-requests = "^2.32.0.20241016"
pytest = "^8.4.2"

[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.*"]
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "basic"
reportMissingImports = "none"
exclude = ["tests"]
