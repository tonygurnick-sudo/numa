[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.poetry]
name = "pipedream-proxy"
version = "0.1.0"
description = "Secure cross-account proxy for Pipedream API operations"
authors = ["ArcanumAI"]
readme = "README.md"
packages = [
    { include = "**/*.py" },
]

[tool.poetry.dependencies]
python = "^3.13"
boto3 = "^1.37.0"
requests = "^2.31.0"
structlog = "^25.2.0"
aws-lambda-powertools = "3.9.0"

[tool.poetry.group.dev.dependencies]
mypy = "1.16.1"
pylint = "3.3.7"
pyright = "1.1.402"
types-requests = "^2.31.0"
boto3-stubs = "^1.37.0"
