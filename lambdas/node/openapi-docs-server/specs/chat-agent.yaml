openapi: 3.0.3
info:
  title: Numa Chat Agent API
  description: |
    The Numa Chat Agent provides AI-powered conversational capabilities with knowledge base integration.

    ## Features
    - Real-time streaming chat responses
    - Knowledge base querying and management
    - Tool integration for web search and external services
    - Conversation history and context management

    ## Authentication
    All endpoints require:
    - **Cognito JWT Token**: Bearer token in Authorization header
    - **CloudFront Secret**: x-arcanum-cloudfront-secret header (auto-injected by CloudFront)
  version: 1.0.0
  contact:
    name: Numa Platform
    url: https://numa.ai
servers:
  - url: https://api.numa.ai
    description: Production API
components:
  securitySchemes:
    CognitoAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito JWT token obtained through authentication flow
    CloudFrontSecret:
      type: apiKey
      in: header
      name: x-arcanum-cloudfront-secret
      description: CloudFront shared secret for direct API access
  schemas:
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant, system, tool]
          description: The role of the message sender
        content:
          type: string
          description: The message content
        timestamp:
          type: string
          format: date-time
          description: When the message was created
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
          description: Tool calls made by the assistant
      required: [role, content]

    ToolCall:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the tool call
        type:
          type: string
          enum: [function]
          description: Type of tool call
        function:
          type: object
          properties:
            name:
              type: string
              description: Name of the function to call
            arguments:
              type: string
              description: JSON string of function arguments
          required: [name, arguments]
      required: [id, type, function]

    KnowledgeBase:
      type: object
      properties:
        kb_id:
          type: string
          description: Knowledge base identifier
          example: 'company'
        kb_name:
          type: string
          description: Knowledge base display name
          example: 'Company Knowledge Base'
        role:
          type: string
          enum: [OWNER, EDITOR, VIEWER]
          description: User role for this knowledge base
        is_shared:
          type: boolean
          description: Whether this knowledge base is shared with other users
        document_count:
          type: integer
          description: Number of documents in the knowledge base
          minimum: 0
        last_updated:
          type: string
          format: date-time
          description: When the knowledge base was last updated
      required: [kb_id, kb_name, role]

    StreamEvent:
      type: object
      properties:
        type:
          type: string
          enum: [start, event, ping, completion, error]
          description: Type of stream event
        data:
          type: object
          description: Event-specific data payload
        timestamp:
          type: string
          format: date-time
          description: Event timestamp
      required: [type]

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code for programmatic handling
        details:
          type: object
          description: Additional error details
      required: [error]

paths:
  /:
    get:
      tags: [Health]
      summary: Health check endpoint
      description: Simple health check to verify the service is running
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'ok'
                  service:
                    type: string
                    example: 'numa-chat-agent'
                  version:
                    type: string
                    example: '1.0.0'
                  timestamp:
                    type: string
                    format: date-time

  /api/numa-chat-agent/stream:
    post:
      tags: [Chat]
      summary: Start streaming chat conversation
      description: |
        Initiate a streaming chat conversation with the AI assistant. The response is delivered
        as NDJSON (newline-delimited JSON) events that include message chunks, tool calls,
        and completion notifications.

        ## Stream Events
        - **start**: Conversation started
        - **event**: Message chunk or tool call
        - **ping**: Keepalive signal
        - **completion**: Conversation completed
        - **error**: Error occurred
      security:
        - CognitoAuth: []
        - CloudFrontSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: The user's message to send to the AI
                  example: "What is the company's vacation policy?"
                conversation_id:
                  type: string
                  description: Optional conversation ID for message continuity
                  example: 'conv_123456789'
                kb_id:
                  type: string
                  description: Knowledge base to use for context retrieval
                  example: 'company'
                stream:
                  type: boolean
                  description: Whether to stream the response (always true for this endpoint)
                  default: true
                max_tokens:
                  type: integer
                  description: Maximum tokens in response
                  default: 4096
                  minimum: 1
                  maximum: 8192
                temperature:
                  type: number
                  description: Response creativity (0.0 to 1.0)
                  default: 0.7
                  minimum: 0.0
                  maximum: 1.0
              required: [message]
            examples:
              simple_question:
                summary: Simple question
                value:
                  message: 'What are our office hours?'
                  kb_id: 'company'
              continue_conversation:
                summary: Continue existing conversation
                value:
                  message: 'Can you elaborate on that policy?'
                  conversation_id: 'conv_123456789'
                  kb_id: 'company'
      responses:
        '200':
          description: Streaming response with NDJSON events
          content:
            text/plain:
              schema:
                type: string
                description: |
                  NDJSON stream where each line is a JSON object representing a stream event.

                  Example events:
                  ```
                  {"type": "start", "data": {"conversation_id": "conv_123"}}
                  {"type": "event", "data": {"content": "Based on our"}}
                  {"type": "event", "data": {"content": " company policy"}}
                  {"type": "completion", "data": {"usage": {"tokens": 150}}}
                  ```
              examples:
                stream_response:
                  summary: Example stream response
                  value: |
                    {"type": "start", "data": {"conversation_id": "conv_123456789"}}
                    {"type": "event", "data": {"content": "Based on our company policy, "}}
                    {"type": "event", "data": {"content": "office hours are 9 AM to 5 PM"}}
                    {"type": "completion", "data": {"usage": {"input_tokens": 25, "output_tokens": 15}}}
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing_message:
                  summary: Missing message
                  value:
                    error: 'Message is required'
                    code: 'MISSING_MESSAGE'
        '401':
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/numa-chat-agent/invoke:
    post:
      tags: [Chat]
      summary: Non-streaming chat conversation
      description: |
        Send a message and receive the complete response in a single request.
        This is useful for applications that prefer traditional request/response
        patterns over streaming.
      security:
        - CognitoAuth: []
        - CloudFrontSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: The user's message
                  example: 'Summarize our Q3 results'
                conversation_id:
                  type: string
                  description: Optional conversation ID
                kb_id:
                  type: string
                  description: Knowledge base to use
                  example: 'company'
                max_tokens:
                  type: integer
                  description: Maximum tokens in response
                  default: 4096
                temperature:
                  type: number
                  description: Response creativity
                  default: 0.7
              required: [message]
      responses:
        '200':
          description: Complete chat response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: The AI assistant's complete response
                  conversation_id:
                    type: string
                    description: Conversation ID for follow-up messages
                  usage:
                    type: object
                    properties:
                      input_tokens:
                        type: integer
                        description: Tokens used in input
                      output_tokens:
                        type: integer
                        description: Tokens used in output
                    description: Token usage statistics
                  tool_calls:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolCall'
                    description: Tools called during response generation
                required: [response, conversation_id]
              examples:
                simple_response:
                  summary: Simple response
                  value:
                    response: 'Our Q3 results show strong growth across all sectors...'
                    conversation_id: 'conv_123456789'
                    usage:
                      input_tokens: 12
                      output_tokens: 45
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/kb:
    get:
      tags: [Knowledge Base]
      summary: List available knowledge bases
      description: |
        Retrieve all knowledge bases accessible to the authenticated user.
        Results are filtered based on user permissions.
      security:
        - CognitoAuth: []
        - CloudFrontSecret: []
      parameters:
        - name: include_stats
          in: query
          description: Include document count and last updated information
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of accessible knowledge bases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBase'
              examples:
                knowledge_bases:
                  summary: Example knowledge bases
                  value:
                    - kb_id: 'company'
                      kb_name: 'Company Knowledge Base'
                      role: 'VIEWER'
                      is_shared: true
                      document_count: 156
                    - kb_id: 'personal_kb_abc123'
                      kb_name: 'My Personal KB'
                      role: 'OWNER'
                      is_shared: false
                      document_count: 23
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Knowledge Base]
      summary: Create new knowledge base
      description: |
        Create a new personal knowledge base. The user becomes the owner
        of the created knowledge base.
      security:
        - CognitoAuth: []
        - CloudFrontSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kb_name:
                  type: string
                  description: Display name for the knowledge base
                  example: 'Project Documentation'
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  description: Optional description of the knowledge base purpose
                  example: 'Documentation and specs for the new project'
                  maxLength: 500
                is_shared:
                  type: boolean
                  description: Whether to make the knowledge base shared
                  default: false
              required: [kb_name]
      responses:
        '201':
          description: Knowledge base created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
              examples:
                created_kb:
                  summary: Newly created knowledge base
                  value:
                    kb_id: 'personal_kb_xyz789'
                    kb_name: 'Project Documentation'
                    role: 'OWNER'
                    is_shared: false
                    document_count: 0
        '400':
          description: Bad request - validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - knowledge base name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/kb/{kb_id}:
    parameters:
      - name: kb_id
        in: path
        required: true
        description: Knowledge base identifier
        schema:
          type: string
          example: 'company'

    get:
      tags: [Knowledge Base]
      summary: Get knowledge base details
      description: Retrieve detailed information about a specific knowledge base
      security:
        - CognitoAuth: []
        - CloudFrontSecret: []
      responses:
        '200':
          description: Knowledge base details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
        '404':
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied to knowledge base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Knowledge Base]
      summary: Update knowledge base
      description: Update knowledge base metadata (requires EDITOR or OWNER role)
      security:
        - CognitoAuth: []
        - CloudFrontSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kb_name:
                  type: string
                  description: Updated display name
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  description: Updated description
                  maxLength: 500
                is_shared:
                  type: boolean
                  description: Update sharing status (OWNER only)
      responses:
        '200':
          description: Knowledge base updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBase'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Knowledge Base]
      summary: Delete knowledge base
      description: Delete a knowledge base (requires OWNER role)
      security:
        - CognitoAuth: []
        - CloudFrontSecret: []
      responses:
        '204':
          description: Knowledge base deleted successfully
        '403':
          description: Insufficient permissions (must be OWNER)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

tags:
  - name: Health
    description: Service health and status endpoints
  - name: Chat
    description: AI chat conversation endpoints
  - name: Knowledge Base
    description: Knowledge base management endpoints
