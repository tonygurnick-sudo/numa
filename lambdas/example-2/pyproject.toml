[tool.poetry]
name = "example-2"
version = "0.1.0"
description = ""
authors = ["ArcanumAI"]
readme = "README.md"
packages = [
    { include = "**/*.py" },
]

[tool.poetry.dependencies]
python = "~3.12.0"

[tool.poetry.group.dev.dependencies]
