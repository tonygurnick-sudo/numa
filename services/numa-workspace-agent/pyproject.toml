[tool.poetry]
name = "numa-workspace-agent"
version = "0.4.0"
description = "Numa Workspace Agent - AgentCore service with Claude Agent SDK"
authors = ["Arcanum AI"]
readme = "README.md"
packages = [{include = "numa_workspace_agent"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
boto3 = "^1.35.0"
structlog = "^24.0.0"
aiofiles = "^24.1.0"
watchtower = "^3.0.0"  # CloudWatch Logs handler for direct log delivery

# Claude Agent SDK (replaces CLI subprocess invocation)
# Pinned to specific version to avoid unexpected behavior changes
claude-agent-sdk = "==0.1.20"

# OpenTelemetry for AgentCore observability
aws-opentelemetry-distro = ">=0.10.0"
opentelemetry-instrumentation-fastapi = ">=0.50b0"
opentelemetry-instrumentation-logging = ">=0.50b0"

# Core data analysis packages
pandas = ">=2.2.0"
numpy = ">=1.26.0"

# Data processing packages (matching claude-code-agent capabilities)
openpyxl = ">=3.1.5"
et-xmlfile = ">=1.1.0"
PyPDF2 = ">=3.0.0"
python-docx = ">=1.1.2"
python-pptx = ">=1.0.2"
xlrd = ">=2.0.1"
extract-msg = ">=0.48.7"
beautifulsoup4 = ">=4.12.3"
html5lib = ">=1.1"
XlsxWriter = ">=3.2.0"

# PDF generation (lightweight, pure Python)
fpdf2 = ">=2.8.0"  # Lightweight PDF generation

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
