[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "transcription-service"
version = "0.1.0"
description = "Long-running transcription service for Fargate"
authors = ["Arcanum AI <dev@arcanum.ai>"]
packages = [{ include = "**/*.py" }]

[tool.poetry.dependencies]
python = "~3.13.0"
boto3 = "^1.40.0"
structlog = "25.2.0"
Pillow = "^10.0.0"
pillow-heif = ">=0.16.0"
PyMuPDF = "^1.24.0,<1.26.1"
openpyxl = "^3.1.5"
python-docx = "^1.1.2"
extract-msg = ">=0.48.7"
ebooklib = ">=0.18"
pyarrow = ">=14.0.0"
cairosvg = ">=2.7.0"
