[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "oauth-providers"
version = "0.1.0"
description = "OAuth provider implementations for cloud storage services"
authors = ["Arcanum AI"]
packages = [{ include = "oauth_providers" }]

[tool.poetry.dependencies]
python = "~3.13.0"
httpx = "^0.25.0"

[tool.poetry.group.dev.dependencies]
mypy = "1.17.1"
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
