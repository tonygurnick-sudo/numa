[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.poetry]
name = "vcon"
version = "0.1.0"
description = "Build IETF vCon (draft-ietf-vcon-vcon-overview) conversation containers for Numa Voice calls"
authors = ["Arcanum"]
packages = [
    { include = "vcon" },
]

[tool.poetry.dependencies]
python = "~3.13.0"

[tool.poetry.group.dev.dependencies]
mypy = "1.17.1"
pylint = "3.3.8"
pyright = "1.1.403"
pytest = "^8.3"

[tool.pytest.ini_options]
pythonpath = ["."]
