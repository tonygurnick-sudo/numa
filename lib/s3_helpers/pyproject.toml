[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = [
    "**/tests/**/*"
]
source = [
    ".",
]

[tool.poetry]
name = "s3_helpers"
version = "0.1.0"
description = ""
authors = ["Arcanum AI"]
readme = "README.md"
packages = [
    { include = "s3_helpers" },
]

[tool.poetry.dependencies]
python = "~3.13.0"

boto3 = "1.37.16"
structlog = "25.2.0"

[tool.poetry.group.dev.dependencies]
boto3-stubs = "1.37.16"
mypy = "1.15.0"
pylint = "3.3.6"
pyright = "1.1.397"
