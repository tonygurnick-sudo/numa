include:
  - project: arcanumai/ci
    file: pipelines/pre-commit.yml
  - project: arcanumai/ci
    file: pipelines/infra.yml
  - project: arcanumai/ci
    file: pipelines/node.yml
  - project: arcanumai/ci
    file: pipelines/python.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  PYTHON_VER: '3.13'

.node-matrix:
  matrix:
    - BUILD_DIR:
        - lambdas/node/api-gateway-authorizer
        - lambdas/node/q-business-chat-control-configurer
        - lambdas/node/srp-proxy
        - numa-management
        - tools

.python-matrix:
  matrix:
    - PYTHON_WORKING_DIRECTORY:
        - deployer
        - infra/bin
        - lambdas/python/aggregate-candidate-results
        - lambdas/python/candidate-screening
        - lambdas/python/example-1
        - lambdas/python/example-2
        - lambdas/python/example-3
        - lambdas/python/extract-content-from-file
        - lambdas/python/financial-analysis-analysis
        - lambdas/python/financial-analysis-data-extraction
        - lambdas/python/meeting-analyser
        - lambdas/python/numa-recent-jobs
        - lambdas/python/policy-builder-completion
        - lambdas/python/policy-builder-expert-review
        - lambdas/python/policy-builder-explainability
        - lambdas/python/policy-builder-generation
        - lambdas/python/policy-builder-legal-review
        - lambdas/python/policy-builder-principles-and-structure
        - lambdas/python/recruitment-job-ad-creation
        - lambdas/python/step-function-start
        - lambdas/python/step-function-status
        - lambdas/python/structured-data-extraction
        - lib/bedrock
        - lib/helpers
        - lib/markdown-to-pdf

python-lint:
  extends: .poetry-job
  needs: []
  parallel: !reference [.python-matrix]
  script:
    - poetry run pylint . --verbose --recursive yes --ignore .venv,.poetry
    - poetry run mypy .
    - poetry run pyright .

python-test:
  parallel: !reference [.python-matrix]

node-lint:
  parallel: !reference [.node-matrix]

node-test:
  parallel: !reference [.node-matrix]

node-build:
  parallel: !reference [.node-matrix]
