include:
  - project: arcanumai/ci
    file: pipelines/pre-commit.yml
  - project: arcanumai/ci
    file: libraries/node.yml
  - project: arcanumai/ci
    file: libraries/python.yml
  - project: arcanumai/ci
    file: libraries/misc.yml
  - .gitlab-ci-clients.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_PIPELINE_SOURCE == "web"

services:
  - docker:dind

variables:
  PYTHON_VER: 3.13

# Override template-defined stages with our consolidated pipeline.
# Old stages (lint, build, test) are replaced by a single "check" stage.
stages:
  - .pre
  - setup
  - check
  - package
  - image-build
  - deploy
  - deploy:customer

# Global defaults — 10min timeout catches stuck runners fast (P90 for most jobs is under 6min).
# Auto-retry on stuck/timeout/runner failures so a bad runner doesn't block the pipeline.
default:
  timeout: 10 minutes
  retry:
    max: 2
    when:
      - stuck_or_timeout_failure
      - runner_system_failure

.rules:
  if-main:
    - if: $CI_COMMIT_BRANCH == "main"
  if-deployable:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

# Blocking manual gate for dev branch — pipeline pauses here until someone clicks play.
# Only appears on dev push. Main and MR pipelines are unaffected.
deploy-dev-gate:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
      allow_failure: false
  script:
    - echo "Dev deploy to arcanum-demo approved. Pipeline proceeding..."

# Disable template-defined pre-commit CI job — redundant with dedicated check jobs
# and local pre-commit hooks that already cover formatting, eslint, and tsc.
pre-commit:
  stage: check
  rules:
    - when: never

