include:
  - project: arcanumai/ci
    file: templates/common-jobs.yml

.apps:
  TYPE: apps
  NAME:
    - document-completeness-app

lint:
  stage: lint
  needs: []
  image: python:3.11
  script:
    - pip install pre-commit
    - pre-commit run --all-files

test:
  stage: test
  image: python:3.11-bookworm
  needs: []
  parallel:
    matrix:
      - !reference [.apps]
  before_script:
    - !reference [.setup-poetry-private-auth]
  script:
    - cd $TYPE/$NAME
    - poetry install
    - poetry run python -m unittest
    - dirname */__init__.py | xargs  poetry run pylint --verbose
    - poetry run mypy .
    - poetry run pyright .
