client-list-lint:
  stage: lint
  needs: []
  image: registry.gitlab.com/arcanumai/ci/all-inclusive
  variables:
    YQ_VERSION: v4.45.1
  before_script:
    - apt-get update
    - apt-get install -y wget
    - wget -O /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64
    - chmod +x /usr/local/bin/yq
  script:
    - diff <(jq --raw-output keys[] clientConfigProd.json | sort) <(yq '.".clients".matrix[0]."CLIENT_NAME"[]' .gitlab-ci.yml | sort)

infra-lint:
  rules:
    - changes:
        paths:
          - infra/**/*
          - style/**/*

python-lint:
  extends: .poetry-job
  needs: []
  parallel: !reference [.python-matrix]
  script:
    - poetry run pylint . --verbose --recursive yes --ignore .venv,.poetry
    - poetry run mypy .
    - poetry run pyright .
  rules:
    - changes:
        paths:
          - $PYTHON_WORKING_DIRECTORY/**/*

python-test:
  parallel: !reference [.python-matrix]

node-lint:
  script:
    - yarn workspaces foreach --parallel --all --exclude infra run lint

node-test:
  parallel: !reference [.node-matrix]

node-build:
  parallel: !reference [.node-matrix]

frontend-test:
  extends: node-test
  parallel:
    matrix:
      - BUILD_DIR: [numa-frontend]

frontend-build:
  extends: node-build
  parallel:
    matrix:
      - BUILD_DIR: [numa-frontend]
  script:
    - corepack enable
    - NODE_OPTIONS=--max-old-space-size=3072 yarn build
  artifacts:
    paths: [infra/build/numa-frontend]

python-package:
  extends: .poetry-job
  stage: package
  script:
    - poetry build-lambda zip-compression=ZIP_DEFLATED
  parallel: !reference [.python-lambdas-matrix]
  artifacts:
    paths: [$PYTHON_WORKING_DIRECTORY/lambda_function.zip]
  rules:
    - !reference [.rules, if-main]

node-package:
  extends: .node_job
  stage: package
  before_script:
    - !reference [.node_job, before_script]
    - apt update && apt install -y zip
  script:
    - yarn bundle
  parallel: !reference [.node-lambdas-matrix]
  artifacts:
    paths:
      - $BUILD_DIR/dist
      - $BUILD_DIR/lambda_function.zip
  rules:
    - !reference [.rules, if-main]

.deploy-infra:
  extends: infra-build
  stage: deploy
  variables:
    TF_ENVIRONMENT: prod
    AWS_REGION: us-east-1
  before_script:
    - !reference [infra-build, before_script]
    - cd bin
    - poetry install
    - cd ..
  script:
    - yarn exec cdktf deploy --auto-approve numa-${CLIENT_NAME}
  needs:
  environment:
    name: $CLIENT_NAME
    url: https://$CLIENT_NAME.numa.arcanum.ai
  resource_group: $CLIENT_NAME

deploy-to-arcanum-demo:
  extends: .deploy-infra
  variables:
    CLIENT_NAME: arcanum-demo
  environment:
    deployment_tier: testing
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-to-arcanum-prod-numa-demo:
  extends: .deploy-infra
  stage: deploy:prod
  variables:
    CLIENT_NAME: arcanum-prod-numa-demo
  environment:
    deployment_tier: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

deploy-to-client:
  extends: .deploy-infra
  stage: deploy:customer
  parallel: !reference [.clients]
  environment:
    deployment_tier: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
