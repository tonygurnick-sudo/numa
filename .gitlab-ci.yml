include:
  - project: arcanumai/ci
    file: pipelines/pre-commit.yml
  - project: arcanumai/ci
    file: pipelines/infra.yml
  - project: arcanumai/ci
    file: pipelines/node.yml
  - project: arcanumai/ci
    file: pipelines/python.yml

variables:
  PYTHON_VER: "3.12"

.node_job:
  variables:
    BUILD_DIR: tools

python-lint:
  extends: .poetry-job
  needs: []
  variables:
    PYTHON_WORKING_DIRECTORY: deployer
  script:
    - poetry run pylint . --verbose --recursive yes --ignore .venv
    - poetry run mypy .
    - poetry run pyright .

python-test:
  variables:
    PYTHON_WORKING_DIRECTORY: deployer
