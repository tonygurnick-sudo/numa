# Build Claude CLI layer ZIP (branch pipelines)
claude-cli-layer-build:
  stage: package
  image: amazonlinux:2023
  rules:
    - if: '$CI_COMMIT_BRANCH'
  variables:
    CLAUDE_CLI_VERSION: "1.0.100"
  before_script:
    - dnf -y install tar gzip zip which jq
  script:
    - set -euo pipefail
    - test -n "$CLAUDE_CLI_VERSION" || (echo "CLAUDE_CLI_VERSION is required" >&2; exit 1)
    # Download claude binary directly from the official GCS bucket and package as a layer
    - GCS_BUCKET="https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases"
    - ARCH=$(uname -m); ARCH_LABEL=$([ "$ARCH" = x86_64 ] && echo x64 || echo arm64)
    - if ldd /bin/ls 2>&1 | grep -q musl; then PLATFORM="linux-${ARCH_LABEL}-musl"; else PLATFORM="linux-${ARCH_LABEL}"; fi
    - |
      if [ "$CLAUDE_CLI_VERSION" = "stable" ] || [ "$CLAUDE_CLI_VERSION" = "latest" ]; then
        VERSION=$(curl -fsSL "$GCS_BUCKET/stable")
      else
        VERSION="$CLAUDE_CLI_VERSION"
      fi
      echo "Using Claude CLI version: $VERSION for $PLATFORM"
    - MANIFEST=$(curl -fsSL "$GCS_BUCKET/$VERSION/manifest.json")
    - CHECKSUM=$(echo "$MANIFEST" | jq -r --arg p "$PLATFORM" '.platforms[$p].checksum')
    - test -n "$CHECKSUM" || (echo "Failed to resolve checksum for $PLATFORM" >&2; exit 1)
    - mkdir -p infra/assets/layers/claude-cli/bin
    - curl -fsSL -o infra/assets/layers/claude-cli/bin/claude "$GCS_BUCKET/$VERSION/$PLATFORM/claude"
    - echo "$CHECKSUM  infra/assets/layers/claude-cli/bin/claude" | sha256sum -c -
    - chmod +x infra/assets/layers/claude-cli/bin/claude
    - (cd infra/assets/layers/claude-cli && zip -r claude-x86_64.zip bin)
    - ls -lh infra/assets/layers/claude-cli/claude-x86_64.zip
    # Package as Lambda Layer at expected path for CDKTF
    - mkdir -p infra/assets/layers/claude-cli/bin
    - cp "$CLAUDE_BIN" infra/assets/layers/claude-cli/bin/claude
    - chmod +x infra/assets/layers/claude-cli/bin/claude
    - (cd infra/assets/layers/claude-cli && zip -r claude-x86_64.zip bin)
    - ls -lh infra/assets/layers/claude-cli/claude-x86_64.zip
  artifacts:
    paths:
      - infra/assets/layers/claude-cli/claude-x86_64.zip
    expire_in: 7 days

# Publish the layer ZIP to deployer S3 (main only)
claude-cli-layer-publish:
  stage: package
  image: registry.gitlab.com/arcanumai/ci/all-inclusive
  needs: ["claude-cli-layer-build"]
  rules:
    - !reference [.rules, if-main]
  variables:
    CLAUDE_CLI_VERSION: "1.0.100"
    CLAUDE_LAYER_S3_PREFIX: "claude-layers"
    AWS_REGION: us-east-1
  before_script:
    - export AWS_ROLE=${AWS_DEPLOYER_ROLE_ARN:-$AWS_CLIENT_ROLE_ARN}
    - !reference [.common-steps, aws-assume-role]
  script:
    - set -euo pipefail
    - export CLAUDE_LAYER_S3_BUCKET=${CLAUDE_LAYER_S3_BUCKET:-numa-claude-cli-layers}
    - test -f infra/assets/layers/claude-cli/claude-x86_64.zip || (echo "Missing layer zip to publish" && exit 1)
    - export LAYER_KEY="${CLAUDE_LAYER_S3_PREFIX}/${CLAUDE_CLI_VERSION}/claude-x86_64.zip"
    - echo "Publishing to s3://${CLAUDE_LAYER_S3_BUCKET}/${LAYER_KEY}"
    - aws s3 cp --only-show-errors infra/assets/layers/claude-cli/claude-x86_64.zip "s3://${CLAUDE_LAYER_S3_BUCKET}/${LAYER_KEY}"
    - aws s3 ls "s3://${CLAUDE_LAYER_S3_BUCKET}/${LAYER_KEY}"

build-deployment-container:
  stage: image-build
  image: registry.gitlab.com/arcanumai/ci/all-inclusive # don't need a lot of this, but it gets us started
  tags:
    - aws # need to use our AWS workers as TLS docker doesn't seem to work on hosted runners
  environment:
    name: prod-images
  variables:
    BUILD_DIR: .
    ECR_REPO: ${ECR_BASE}/numa-deploy
    CLAUDE_CLI_VERSION: "1.0.100"
    CLAUDE_LAYER_S3_PREFIX: "claude-layers"
  before_script:
    - !reference [.yarn, setup-private-auth]
    - !reference [.node_job, before_script]
    - (cd infra && yarn exec cdktf get)
  script:
    # install only the infra deps
    - yarn workspaces focus @arcanumai/q-apps-deployer-infra
    # possibly swap to kaniko to remove need for dind
    - |
      # Assume deployer role for S3 presign
      export AWS_ROLE=${AWS_DEPLOYER_ROLE_ARN:-$AWS_CLIENT_ROLE_ARN}
      ! reference [.common-steps, aws-assume-role]
    - |
      PRESIGNED=""
      export CLAUDE_LAYER_S3_BUCKET=${CLAUDE_LAYER_S3_BUCKET:-numa-claude-cli-layers}
      if [ -n "${CLAUDE_LAYER_S3_BUCKET}" ]; then
        export LAYER_KEY="${CLAUDE_LAYER_S3_PREFIX}/${CLAUDE_CLI_VERSION}/claude-x86_64.zip"
        echo "Generating presigned URL for s3://${CLAUDE_LAYER_S3_BUCKET}/${LAYER_KEY}"
        PRESIGNED=$(aws s3 presign "s3://${CLAUDE_LAYER_S3_BUCKET}/${LAYER_KEY}" --expires-in 7200) || PRESIGNED=""
      fi
      docker build \
        --build-arg GIT_HASH=${CI_COMMIT_SHORT_SHA} \
        --build-arg GIT_BRANCH=${CI_COMMIT_BRANCH} \
        --build-arg CI_PROJECT_PATH=$CI_PROJECT_PATH \
        --build-arg CLAUDE_CLI_VERSION=${CLAUDE_CLI_VERSION} \
        --build-arg CLAUDE_LAYER_URL="${PRESIGNED}" \
        -f infra/container/Dockerfile . -t deploy:${CI_COMMIT_SHORT_SHA}
    - |
      # Re-assume client/images role for ECR push
      export AWS_ROLE=${AWS_CLIENT_ROLE_ARN}
      ! reference [.common-steps, aws-assume-role]
    - docker tag deploy:${CI_COMMIT_SHORT_SHA} ${ECR_REPO}:latest
    - docker tag deploy:${CI_COMMIT_SHORT_SHA} ${ECR_REPO}:${CI_COMMIT_SHORT_SHA}
    - aws ecr get-login-password | docker login -u AWS --password-stdin "https://${ECR_REPO}"
    - docker push ${ECR_REPO}:latest
    - docker push ${ECR_REPO}:${CI_COMMIT_SHORT_SHA}
  rules:
    - !reference [.rules, if-main]

.deploy-infra:
  extends: .node-job-infra-overrides
  stage: deploy
  variables:
    TF_ENVIRONMENT: prod
    AWS_REGION: us-east-1
    CLIENT_OVERRIDE: $CLIENT_NAME
  needs: ["claude-cli-layer-build"]
  script:
    - yarn exec cdktf deploy --auto-approve numa-${CLIENT_NAME}
  needs:
  environment:
    name: $CLIENT_NAME
    url: https://$CLIENT_NAME.numa.arcanum.ai
  resource_group: $CLIENT_NAME

deploy-to-arcanum-demo:
  extends: .deploy-infra
  artifacts:
    paths:
      - infra/**/archive.zip
    when: on_failure
  variables:
    CLIENT_NAME: arcanum-demo
  environment:
    deployment_tier: testing
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

deploy-to-median:
  extends: .deploy-infra
  artifacts:
    paths:
      - infra/**/archive.zip
    when: on_failure
  variables:
    CLIENT_NAME: median
  environment:
    deployment_tier: testing
  needs: ["deploy-to-arcanum-demo"]  # optional dependency on demo
  before_script:
    - !reference [.yarn, setup-private-auth]
    - corepack enable
    - (cd infra && yarn install --immutable)
    - (cd infra && yarn exec cdktf get)
    - cd infra
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual




deploy-to-client:
  extends: .deploy-infra
  stage: deploy:customer
  parallel: !reference [.clients]
  environment:
    deployment_tier: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_ALL_CUSTOMERS == "1"'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  release:
    name: "Customer deploy [$CLIENT_NAME] ${CI_COMMIT_SHORT_SHA}"
    tag_name: "customer-deploy/${CLIENT_NAME}/${CI_COMMIT_SHORT_SHA}"
    ref: $CI_COMMIT_SHA
    description: |
      Full customer deploy for ${CLIENT_NAME}
      Pipeline: ${CI_PIPELINE_URL}

deploy-to-client-custom:
  extends: .deploy-infra
  stage: deploy:customer
  variables:
    CLIENT_NAME:
  environment:
    name: custom
    url:
    deployment_tier: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  release:
    name: "Customer deploy [custom:${CLIENT_NAME}] ${CI_COMMIT_SHORT_SHA}"
    tag_name: "customer-deploy/${CLIENT_NAME}/${CI_COMMIT_SHORT_SHA}"
    ref: $CI_COMMIT_SHA
    description: |
      Custom customer deploy for ${CLIENT_NAME}
      Pipeline: ${CI_PIPELINE_URL}
