python-lambdas-package:
  extends: .poetry-job
  stage: package
  script:
    - $CI_PROJECT_DIR/lambdas/package-python-lambda.sh .
  parallel: !reference [.python-lambdas-matrix]
  artifacts:
    paths: [$PYTHON_WORKING_DIRECTORY/lambda_function.zip]
  rules:
    - !reference [.rules, if-deployable]

node-package:
  extends: .node_job
  stage: package
  before_script:
    - !reference [.yarn, setup-private-auth]
    - corepack enable
    - yarn install --immutable
    - cd $BUILD_DIR
    - apt update && apt install -y zip
  script:
    - |
      if [[ "$BUILD_DIR" == lib/* ]]; then
        echo "Skipping library directory (not a packaged lambda)"
        exit 0
      fi
    - yarn bundle
  parallel: !reference [.node-matrix]
  artifacts:
    paths:
      - $BUILD_DIR/dist
      - $BUILD_DIR/lambda_function.zip
  rules:
    - !reference [.rules, if-deployable]

# Build Claude CLI artifact ZIP (main + CI config changes only)
claude-cli-artifact-build:
  stage: package
  image: amazonlinux:2023
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
  variables:
    CLAUDE_CLI_VERSION: '2.0.37'
  before_script:
    - dnf -y install tar gzip zip which jq
  script:
    - set -euo pipefail
    - test -n "$CLAUDE_CLI_VERSION" || (echo "CLAUDE_CLI_VERSION is required" >&2; exit 1)
    # Download claude binary directly from the official GCS bucket and package as an artifact
    - GCS_BUCKET="https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases"
    - ARCH=$(uname -m); ARCH_LABEL=$([ "$ARCH" = x86_64 ] && echo x64 || echo arm64)
    - if ldd /bin/ls 2>&1 | grep -q musl; then PLATFORM="linux-${ARCH_LABEL}-musl"; else PLATFORM="linux-${ARCH_LABEL}"; fi
    - |
      if [ "$CLAUDE_CLI_VERSION" = "stable" ] || [ "$CLAUDE_CLI_VERSION" = "latest" ]; then
        VERSION=$(curl -fsSL "$GCS_BUCKET/stable")
      else
        VERSION="$CLAUDE_CLI_VERSION"
      fi
      echo "Using Claude CLI version: $VERSION for $PLATFORM"
    - MANIFEST=$(curl -fsSL "$GCS_BUCKET/$VERSION/manifest.json")
    - CHECKSUM=$(echo "$MANIFEST" | jq -r --arg p "$PLATFORM" '.platforms[$p].checksum')
    - test -n "$CHECKSUM" || (echo "Failed to resolve checksum for $PLATFORM" >&2; exit 1)
    - mkdir -p infra/assets/artifacts/claude-cli/bin
    - curl -fsSL -o infra/assets/artifacts/claude-cli/bin/claude "$GCS_BUCKET/$VERSION/$PLATFORM/claude"
    - echo "$CHECKSUM  infra/assets/artifacts/claude-cli/bin/claude" | sha256sum -c -
    - chmod +x infra/assets/artifacts/claude-cli/bin/claude
    - (cd infra/assets/artifacts/claude-cli && zip -r claude-x86_64.zip bin)
    - ls -lh infra/assets/artifacts/claude-cli/claude-x86_64.zip
  artifacts:
    paths:
      - infra/assets/artifacts/claude-cli/claude-x86_64.zip
    expire_in: 7 days

# Build workspace-agent Docker image as tar for Fargate deployment
# Uses BuildKit local cache to avoid rebuilding system packages, Node.js, Pandoc,
# and Python deps on every run. First build is full (~27min), subsequent builds
# that only change application code take ~5-8min.
workspace-agent-package:
  stage: package
  timeout: 45 minutes # ARM64 cross-compile via QEMU — P90 is ~27min
  image: docker:24
  services:
    - docker:24-dind
  tags:
    - aws # Runs on AWS workers with Docker
  rules:
    - !reference [.rules, if-deployable]
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
    # BuildKit cache: reuse system packages, Node.js, Pandoc, Python deps between builds.
    # mode=max exports all layers (not just final image), maximising cache hits.
    # --cache-from silently ignores missing cache on first run.
    DOCKER_BUILD_OPTS: '--cache-from type=local,src=$CI_PROJECT_DIR/.docker-cache --cache-to type=local,dest=$CI_PROJECT_DIR/.docker-cache,mode=max'
  cache:
    - key: workspace-agent-docker-${CI_DEFAULT_BRANCH}
      paths:
        - .docker-cache/
  before_script:
    - apk add --no-cache bash git
    # Register QEMU emulators for cross-platform builds (ARM64 on x86_64 runner)
    # This enables Docker to build ARM64 images on x86_64 hosts via emulation
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
  script:
    - cd services
    - chmod +x package-service.sh
    - ./package-service.sh numa-workspace-agent
  artifacts:
    paths:
      - infra/assets/artifacts/numa-workspace-agent/image.tar
    expire_in: 7 days

# Build transcription-service Docker image as tar for Fargate deployment
transcription-service-package:
  stage: package
  timeout: 30 minutes
  image: docker:24
  services:
    - docker:24-dind
  tags:
    - aws
  rules:
    - !reference [.rules, if-deployable]
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILD_OPTS: '--cache-from type=local,src=$CI_PROJECT_DIR/.docker-cache-transcription --cache-to type=local,dest=$CI_PROJECT_DIR/.docker-cache-transcription,mode=max'
  cache:
    - key: transcription-service-docker-${CI_DEFAULT_BRANCH}
      paths:
        - .docker-cache-transcription/
  before_script:
    - apk add --no-cache bash git
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
  script:
    - cd services
    - chmod +x package-service.sh
    - ./package-service.sh transcription-service
  artifacts:
    paths:
      - infra/assets/artifacts/transcription-service/image.tar
    expire_in: 7 days

# Publish the artifact ZIP to deployer S3 (main only)
claude-cli-artifact-publish:
  stage: package
  image: registry.gitlab.com/arcanumai/ci/all-inclusive
  needs: ['claude-cli-artifact-build']
  rules:
    - !reference [.rules, if-main]
  variables:
    CLAUDE_CLI_VERSION: '2.0.37'
    CLAUDE_ARTIFACT_S3_PREFIX: 'claude-artifacts'
    AWS_REGION: us-east-1
  before_script:
    - export AWS_ROLE=${AWS_DEPLOYER_ROLE_ARN:-$AWS_CLIENT_ROLE_ARN}
    - !reference [.common-steps, aws-assume-role]
  script:
    - set -euo pipefail
    - export CLAUDE_ARTIFACT_S3_BUCKET=${CLAUDE_ARTIFACT_S3_BUCKET:-numa-claude-cli-artifacts}
    - test -f infra/assets/artifacts/claude-cli/claude-x86_64.zip || (echo "Missing artifact zip to publish" && exit 1)
    - export ARTIFACT_KEY="${CLAUDE_ARTIFACT_S3_PREFIX}/${CLAUDE_CLI_VERSION}/claude-x86_64.zip"
    - echo "Publishing to s3://${CLAUDE_ARTIFACT_S3_BUCKET}/${ARTIFACT_KEY}"
    - aws s3 cp --only-show-errors infra/assets/artifacts/claude-cli/claude-x86_64.zip "s3://${CLAUDE_ARTIFACT_S3_BUCKET}/${ARTIFACT_KEY}"
    - aws s3 ls "s3://${CLAUDE_ARTIFACT_S3_BUCKET}/${ARTIFACT_KEY}"

build-deployment-container:
  stage: image-build
  timeout: 30 minutes # Docker build + ECR push — P90 is ~12min
  image: registry.gitlab.com/arcanumai/ci/all-inclusive # don't need a lot of this, but it gets us started
  tags:
    - aws # need to use our AWS workers as TLS docker doesn't seem to work on hosted runners
  environment:
    name: prod-images
  # Note: Removed explicit `needs` to work around GitLab's 50-job limit.
  # This job runs after the package stage completes and automatically
  # receives all artifacts from python-lambdas-package, node-package,
  # claude-cli-artifact-build, and workspace-agent-package.
  variables:
    BUILD_DIR: .
    ECR_REPO: ${ECR_BASE}/numa-deploy
  before_script:
    - !reference [.yarn, setup-private-auth]
    - !reference [.node_job, before_script]
  script:
    # install only the infra deps
    - yarn workspaces focus @arcanumai/q-apps-deployer-infra
    - (cd infra && yarn exec cdktf get)
    # Build will pick up the artifact from infra/assets/artifacts/claude-cli/claude-x86_64.zip
    - |
      set -euo pipefail
      docker build \
        -f infra/container/Dockerfile \
        --build-arg GIT_HASH="${CI_COMMIT_SHORT_SHA}" \
        --build-arg GIT_BRANCH="${CI_COMMIT_BRANCH}" \
        --build-arg CI_PROJECT_PATH="${CI_PROJECT_PATH}" \
        -t deploy:${CI_COMMIT_SHORT_SHA} \
        .
    # Assume client/images role for ECR push
    - unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN AWS_PROFILE
    - export AWS_ROLE=${AWS_CLIENT_ROLE_ARN}
    - !reference [.common-steps, aws-assume-role]
    - export ECR_REGION=${ECR_REGION:-ap-southeast-2}
    - docker tag deploy:${CI_COMMIT_SHORT_SHA} ${ECR_REPO}:latest
    - docker tag deploy:${CI_COMMIT_SHORT_SHA} ${ECR_REPO}:${CI_COMMIT_SHORT_SHA}
    # Login should target the ECR registry domain (not the repo path)
    - ECR_REGISTRY=$(echo "${ECR_REPO}" | cut -d/ -f1)
    - aws ecr get-login-password --region "${ECR_REGION}" | docker login -u AWS --password-stdin "${ECR_REGISTRY}"
    - docker push ${ECR_REPO}:latest
    - docker push ${ECR_REPO}:${CI_COMMIT_SHORT_SHA}
  rules:
    - !reference [.rules, if-main]

.deploy-infra:
  extends: .node-job-infra-overrides
  stage: deploy
  timeout: 35 minutes # CDKTF deploy — P90 is ~23min
  variables:
    TF_ENVIRONMENT: prod
    AWS_REGION: us-east-1
    CLIENT_OVERRIDE: $CLIENT_NAME
  # No explicit `needs` so deploy receives all packaging artifacts
  script:
    - yarn exec cdktf deploy --auto-approve numa-${CLIENT_NAME}
  environment:
    name: $CLIENT_NAME
    url: https://$CLIENT_NAME.numa.arcanum.ai
  resource_group: $CLIENT_NAME

deploy-to-arcanum-demo:
  extends: .deploy-infra
  artifacts:
    paths:
      - infra/**/archive.zip
    when: on_failure
  variables:
    CLIENT_NAME: arcanum-demo
  environment:
    deployment_tier: testing
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual

deploy-to-median:
  extends: .deploy-infra
  artifacts:
    paths:
      - infra/**/archive.zip
    when: on_failure
  variables:
    CLIENT_NAME: median
  environment:
    deployment_tier: testing
  needs: ['deploy-to-arcanum-demo'] # optional dependency on demo
  before_script:
    - !reference [.yarn, setup-private-auth]
    - corepack enable
    - (cd infra && yarn install --immutable)
    - (cd infra && yarn exec cdktf get)
    - cd infra
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

deploy-to-client:
  extends: .deploy-infra
  stage: deploy:customer
  parallel: !reference [.clients]
  environment:
    deployment_tier: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DEPLOY_ALL_CUSTOMERS == "1"'
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  release:
    name: 'Customer deploy [$CLIENT_NAME] ${CI_COMMIT_SHORT_SHA}'
    tag_name: 'customer-deploy/${CLIENT_NAME}/${CI_COMMIT_SHORT_SHA}'
    ref: $CI_COMMIT_SHA
    description: |
      Full customer deploy for ${CLIENT_NAME}
      Pipeline: ${CI_PIPELINE_URL}

deploy-to-client-custom:
  extends: .deploy-infra
  stage: deploy:customer
  variables:
    CLIENT_NAME:
  environment:
    name: custom
    url:
    deployment_tier: production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  release:
    name: 'Customer deploy [custom:${CLIENT_NAME}] ${CI_COMMIT_SHORT_SHA}'
    tag_name: 'customer-deploy/${CLIENT_NAME}/${CI_COMMIT_SHORT_SHA}'
    ref: $CI_COMMIT_SHA
    description: |
      Custom customer deploy for ${CLIENT_NAME}
      Pipeline: ${CI_PIPELINE_URL}
