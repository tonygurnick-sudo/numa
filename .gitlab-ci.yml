include:
  - project: arcanumai/ci
    file: pipelines/pre-commit.yml
  - project: arcanumai/ci
    file: libraries/node.yml
  - project: arcanumai/ci
    file: libraries/python.yml
  - .gitlab-ci-clients.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  PYTHON_VER: 3.13

.rules:
  if-main:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.node-lambdas-matrix:
