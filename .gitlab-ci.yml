.node_job:
  cache:
    - key:
        files:
          - yarn.lock
      fallback_keys:
        - yarn-cache-$CI_DEFAULT_BRANCH
      paths:
        - .yarn/cache/
        - node_modules/
        - .pnp.*
  before_script:
    - !reference [.yarn, setup-private-auth]
    - corepack enable
    - yarn install --immutable
    - cd $BUILD_DIR

install-common-dependencies:
  stage: setup
  image: node:lts
  interruptible: true
  cache:
    - key:
        files:
          - yarn.lock
      fallback_keys:
        - yarn-cache-$CI_DEFAULT_BRANCH
      paths:
        - .yarn/cache/
  before_script:
    - !reference [.yarn, setup-private-auth]
  script:
    - !reference [.yarn, install]
  artifacts:
    paths:
      - node_modules
  rules:
    - !reference [.rules, if-deployable]

.node-job-cdktf-get-before-script: &node-job-cdktf-get-before-script
  before_script:
    # Install curl, jq, skopeo, and AWS CLI for Terraform local-exec provisioners (e.g., workspace-agent ECR push)
    - apt-get update && apt-get install -y -qq curl jq && rm -rf /var/lib/apt/lists/*
    - curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
    - unzip -q /tmp/awscliv2.zip -d /tmp && /tmp/aws/install && rm -rf /tmp/aws /tmp/awscliv2.zip
    - curl -fsSL https://github.com/lework/skopeo-binary/releases/download/v1.16.1/skopeo-linux-amd64 -o /usr/local/bin/skopeo && chmod +x /usr/local/bin/skopeo
    - !reference [.yarn, setup-private-auth]
    - corepack enable
    - yarn install --immutable
    - (cd infra && yarn exec cdktf get)
    - cd $BUILD_DIR

.node-job-infra-overrides: &node-job-infra-overrides
  image: registry.gitlab.com/arcanumai/ci/cdktf:latest
  variables:
    BUILD_DIR: infra
  <<: *node-job-cdktf-get-before-script

.node-job-tools-overrides: &node-job-tools-overrides
  image: registry.gitlab.com/arcanumai/ci/cdktf:latest
  variables:
    BUILD_DIR: tools
  <<: *node-job-cdktf-get-before-script

infra-check:
  stage: check
  <<: *node-job-infra-overrides
  interruptible: true
  script:
    - yarn lint
    - yarn test
    - yarn build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - changes:
        paths:
          - lib/client-config-node/**/*
          - infra/**/*
          - style/**/*
          - .gitlab-ci.yml

# Consolidated Python check: pyright (type-checking) + unittest in one job per module.
# pylint and mypy removed — pyright catches real bugs, pre-commit handles formatting.
.python-check-base:
  extends: .poetry-job
  stage: check
  interruptible: true
  cache:
    - key:
        files:
          - $PYTHON_WORKING_DIRECTORY/poetry.lock
      fallback_keys:
        - poetry-cache-$CI_DEFAULT_BRANCH-$PYTHON_WORKING_DIRECTORY
      paths:
        - $PYTHON_WORKING_DIRECTORY/.venv/

python-libraries-check:
  extends: .python-check-base
  script:
    - poetry run pyright .
    - if [ -d tests ]; then poetry run python -m unittest discover -s tests -v; else echo "No tests/ directory, skipping"; fi
  parallel: !reference [.python-libraries-matrix]
  rules:
    - changes:
        paths:
          - $PYTHON_WORKING_DIRECTORY/**/*
          - .gitlab-ci.yml

python-lambdas-check:
  extends: .python-check-base
  script:
    - poetry run pyright .
    - if [ -d tests ]; then poetry run python -m unittest discover -s tests -v; else echo "No tests/ directory, skipping"; fi
  parallel: !reference [.python-lambdas-matrix]
  rules:
    - changes:
        paths:
          - $PYTHON_WORKING_DIRECTORY/**/*
          - lib/**/*
          - .gitlab-ci.yml

