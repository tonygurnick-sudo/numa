include:
  - project: arcanumai/ci
    file: pipelines/pre-commit.yml
  - project: arcanumai/ci
    file: pipelines/infra.yml
  - project: arcanumai/ci
    file: pipelines/node.yml
  - project: arcanumai/ci
    file: pipelines/python.yml

variables:
  PYTHON_VER: "3.12"

.node-matrix:
  matrix:
    - BUILD_DIR:
        - tools
        - lambdas/srp-proxy

.python-matrix:
  matrix:
    - PYTHON_WORKING_DIRECTORY:
        - deployer
        - lambdas/example-1
        - lambdas/example-2
        - lambdas/example-3
        - lambdas/extract-content-from-file
        - lambdas/meeting-tools-app-formatting
        - lambdas/numa-recent-jobs
        - lambdas/step-function-start
        - lambdas/step-function-status
        - lambdas/structured-data-extraction
        - lib/bedrock
        - lib/helpers
        - lib/markdown-to-pdf

python-lint:
  extends: .poetry-job
  needs: []
  parallel: !reference [.python-matrix]
  script:
    - poetry run pylint . --verbose --recursive yes --ignore .venv
    - poetry run mypy .
    - poetry run pyright .

python-test:
  parallel: !reference [.python-matrix]

node-lint:
  parallel: !reference [.node-matrix]

node-test:
  parallel: !reference [.node-matrix]

node-build:
  parallel: !reference [.node-matrix]
